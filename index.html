<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Stock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .stock-bajo { background-color: #ffcccc; }
        .stock-medio { background-color: #fff3cd; }
        .stock-ok { background-color: #d4edda; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <nav class="navbar navbar-dark bg-primary">
            <div class="container">
                <span class="navbar-brand mb-0 h1">
                    <i class="fas fa-boxes me-2"></i>Control de Stock
                </span>
            </div>
        </nav>

        <div class="container mt-4">
            <!-- Formulario para agregar productos -->
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="mb-0">Agregar Producto</h5>
                </div>
                <div class="card-body">
                    <form id="productForm">
                        <div class="row">
                            <div class="col-md-3">
                                <input type="text" class="form-control" id="productName" placeholder="Nombre del producto" required>
                            </div>
                            <div class="col-md-2">
                                <input type="number" class="form-control" id="productStock" placeholder="Stock" required>
                            </div>
                            <div class="col-md-2">
                                <input type="number" class="form-control" id="productMinStock" placeholder="Stock mínimo" required>
                            </div>
                            <div class="col-md-3">
                                <input type="text" class="form-control" id="productCategory" placeholder="Categoría">
                            </div>
                            <div class="col-md-2">
                                <button type="submit" class="btn btn-success w-100">
                                    <i class="fas fa-plus me-1"></i>Agregar
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Lista de productos -->
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Inventario</h5>
                    <div>
                        <input type="text" class="form-control" id="searchInput" placeholder="Buscar productos...">
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>Producto</th>
                                    <th>Stock</th>
                                    <th>Mínimo</th>
                                    <th>Categoría</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="productTable">
                                <!-- Los productos se cargarán aquí -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Array para almacenar los productos
        let products = JSON.parse(localStorage.getItem('stockProducts')) || [];

        // Función para guardar en localStorage
        function saveProducts() {
            localStorage.setItem('stockProducts', JSON.stringify(products));
        }

        // Función para determinar la clase CSS según el stock
        function getStockClass(stock, minStock) {
            if (stock === 0) return 'stock-bajo';
            if (stock <= minStock) return 'stock-medio';
            return 'stock-ok';
        }

        // Función para determinar el texto del estado
        function getStockStatus(stock, minStock) {
            if (stock === 0) return '<span class="badge bg-danger">Sin Stock</span>';
            if (stock <= minStock) return '<span class="badge bg-warning text-dark">Stock Bajo</span>';
            return '<span class="badge bg-success">Disponible</span>';
        }

        // Función para renderizar la tabla
        function renderTable() {
            const table = document.getElementById('productTable');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            const filteredProducts = products.filter(product => 
                product.name.toLowerCase().includes(searchTerm) ||
                product.category.toLowerCase().includes(searchTerm)
            );

            table.innerHTML = filteredProducts.map((product, index) => `
                <tr class="${getStockClass(product.stock, product.minStock)}">
                    <td>${product.name}</td>
                    <td>${product.stock}</td>
                    <td>${product.minStock}</td>
                    <td>${product.category}</td>
                    <td>${getStockStatus(product.stock, product.minStock)}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="editProduct(${index})">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger me-1" onclick="deleteProduct(${index})">
                            <i class="fas fa-trash"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-success" onclick="increaseStock(${index})">
                            <i class="fas fa-plus"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-warning" onclick="decreaseStock(${index})">
                            <i class="fas fa-minus"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // Función para agregar producto
        document.getElementById('productForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const product = {
                name: document.getElementById('productName').value,
                stock: parseInt(document.getElementById('productStock').value),
                minStock: parseInt(document.getElementById('productMinStock').value),
                category: document.getElementById('productCategory').value
            };

            products.push(product);
            saveProducts();
            renderTable();
            this.reset();
        });

        // Función para eliminar producto
        function deleteProduct(index) {
            if (confirm('¿Estás seguro de eliminar este producto?')) {
                products.splice(index, 1);
                saveProducts();
                renderTable();
            }
        }

        // Función para aumentar stock
        function increaseStock(index) {
            products[index].stock += 1;
            saveProducts();
            renderTable();
        }

        // Función para disminuir stock
        function decreaseStock(index) {
            if (products[index].stock > 0) {
                products[index].stock -= 1;
                saveProducts();
                renderTable();
            }
        }

        // Función para editar producto (simplificada)
        function editProduct(index) {
            const product = products[index];
            const newName = prompt('Nuevo nombre:', product.name);
            const newStock = prompt('Nuevo stock:', product.stock);
            const newMinStock = prompt('Nuevo stock mínimo:', product.minStock);
            const newCategory = prompt('Nueva categoría:', product.category);

            if (newName) product.name = newName;
            if (newStock) product.stock = parseInt(newStock);
            if (newMinStock) product.minStock = parseInt(newMinStock);
            if (newCategory) product.category = newCategory;

            saveProducts();
            renderTable();
        }

        // Búsqueda en tiempo real
        document.getElementById('searchInput').addEventListener('input', renderTable);

        // Inicializar la tabla
        renderTable();
    </script>
</body>
</html>
